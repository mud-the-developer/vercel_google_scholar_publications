name: Update Scholar citations

on:
  schedule:
    - cron: "17 0 * * *" # 매일 09:17 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-scholar-citations
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fetch Google Scholar via SerpApi
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: npx --yes tsx@4.20.6 scripts/scrape.ts -Uiul2AAAAAJ
      - name: Commit updated data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --quiet -- data/ && exit 0
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Update Scholar citations"
          gh auth setup-git
          git push
